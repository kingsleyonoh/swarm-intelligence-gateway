name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: swarm
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: swarm_gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarm -d swarm_gateway"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://swarm:dev@localhost:5432/swarm_gateway
      REDIS_URL: redis://localhost:6379
      WORLDMONITOR_REDIS_URL: redis://localhost:6379
      MIROFISH_API_URL: ''
      NODE_ENV: test
      LOG_LEVEL: warn
      SELF_REGISTRATION_ENABLED: 'true'
      NOTIFICATION_HUB_ENABLED: 'false'
      DEMO_MODE: 'false'
      DEFAULT_AGENT_COUNT: '1'
      DEFAULT_ROUND_COUNT: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the repository npm toolchain
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run backend tests
        run: npm test

      - name: Type-check and build backend
        run: |
          npx tsc --noEmit
          npm run build

      - name: Run frontend tests and build
        run: |
          npm --workspace packages/frontend test -- --run
          npm --workspace packages/frontend run build

      - name: Build production container
        run: docker build --tag swarm-gateway:ci .
